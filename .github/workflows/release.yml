name: Build Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Run Go tests
        run: go test ./...

      - name: Build CLI-only binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -ldflags "-X github.com/gliese129/runq/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$BINARY_NAME" ./cmd/runq

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: web/dashboard/yarn.lock

      - name: Set up yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build dashboard
        working-directory: web/dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build Go binary with embedded dashboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -tags dashboard \
            -ldflags "-X github.com/gliese129/runq/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$BINARY_NAME" ./cmd/runq

      - name: Verify stamped version
        if: matrix.goarch == 'amd64'
        run: |
          test "$(./runq-${{ matrix.goos }}-${{ matrix.goarch }} version)" = "${GITHUB_REF_NAME}"
          test "$(./runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }} version)" = "${GITHUB_REF_NAME}"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runq-${{ matrix.goos }}-${{ matrix.goarch }}
            runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build skill bundle
        run: |
          mkdir -p release/runq
          cp -R .skills/runq/. release/runq/
          cd release
          zip -r "../runq-skills-${GITHUB_REF_NAME}.zip" runq

      - name: Verify skill bundle contents
        run: |
          ARCHIVE="runq-skills-${GITHUB_REF_NAME}.zip"
          unzip -Z1 "$ARCHIVE" | grep -qx 'runq/SKILL.md'
          unzip -Z1 "$ARCHIVE" | grep -qx 'runq/references/migration.md'
          unzip -Z1 "$ARCHIVE" | grep -qx 'runq/references/sdk.md'
          unzip -Z1 "$ARCHIVE" | grep -qx 'runq/references/setup.md'

      - name: Upload skill bundle
        uses: softprops/action-gh-release@v2
        with:
          files: runq-skills-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-sdk:
    needs:
      - build-go
      - build-skills
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runq-sdk
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade build
          python -m pip install -e "./sdk/python[dev]"

      - name: Test Python SDK
        run: python -m pytest sdk/python/tests -q

      - name: Build Python SDK
        run: |
          python -m build sdk/python

      - name: Verify Python distribution
        run: |
          python -m venv /tmp/runq-wheel-test
          /tmp/runq-wheel-test/bin/pip install sdk/python/dist/*.whl
          /tmp/runq-wheel-test/bin/python -c "import runq; assert runq.__version__ == '${GITHUB_REF_NAME#v}'"

      - name: Upload Python SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
