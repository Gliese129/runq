name: Build Release
on:
  push:
    tags:
      - 'v*'

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Run Go tests
        run: go test ./...

  build-go:
    needs: test-go
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Build CLI-only binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -ldflags "-X github.com/gliese129/runq-lab/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$BINARY_NAME" ./cmd/runq

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: web/dashboard/yarn.lock

      - name: Set up yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build dashboard
        working-directory: web/dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build Go binary with embedded dashboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -tags dashboard \
            -ldflags "-X github.com/gliese129/runq-lab/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$BINARY_NAME" ./cmd/runq

      - name: Verify stamped version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          test "$(./runq-${{ matrix.goos }}-${{ matrix.goarch }} version)" = "${GITHUB_REF_NAME}"
          test "$(./runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }} version)" = "${GITHUB_REF_NAME}"

      - name: Build checksums
        run: |
          sha256sum "runq-${{ matrix.goos }}-${{ matrix.goarch }}" \
            > "runq-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
          sha256sum "runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}" \
            > "runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - name: Upload runq release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            runq-${{ matrix.goos }}-${{ matrix.goarch }}
            runq-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
            runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
            runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-installer:
    needs: test-go
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify installer
        run: |
          sh -n install.sh tests/install/test_install.sh
          sh tests/install/test_install.sh
          sha256sum install.sh > install.sh.sha256

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            install.sh
            install.sh.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-sdk:
    needs:
      - test-go
      - build-go
      - release-installer
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runq-sdk
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade build
          python -m pip install -e "./sdk/python[dev]"

      - name: Test Python SDK
        run: python -m pytest sdk/python/tests -q

      - name: Build Python SDK
        run: |
          python -m build sdk/python

      - name: Verify Python distribution
        run: |
          python -m venv /tmp/runq-wheel-test
          /tmp/runq-wheel-test/bin/pip install sdk/python/dist/*.whl
          /tmp/runq-wheel-test/bin/python -c "import runq; assert runq.__version__ == '${GITHUB_REF_NAME#v}'"

      - name: Upload Python SDK
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
