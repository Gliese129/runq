name: Build Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Build CLI-only binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -o "$BINARY_NAME" ./cmd/runq

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: web/dashboard/yarn.lock

      - name: Set up yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build dashboard
        working-directory: web/dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build Go binary with embedded dashboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -tags dashboard -o "$BINARY_NAME" ./cmd/runq

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runq-${{ matrix.goos }}-${{ matrix.goarch }}
            runq-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Build Python SDK
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python

      - name: Upload Python SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
