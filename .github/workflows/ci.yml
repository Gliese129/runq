name: CI
on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  go-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Install dependencies
        run: go mod download

      - name: Static Analysis
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          install-go: 'false'

      - name: Compilation Check
        run: go build ./...

      - name: Run unit test
        run: go test -v -race ./...
        env:
          USE_MOCK_ALLOCATOR: "true" # for future mock test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'true'

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: web/dashboard/yarn.lock

      - name: Set up yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build dashboard
        working-directory: web/dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build Go binary with embedded dashboard
        run: go build -tags dashboard ./cmd/runq
