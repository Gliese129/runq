<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runq dashboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f7f8fa;
      }
      main {
        width: min(560px, calc(100vw - 40px));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #53616f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>runq dashboard</h1>
      <p>The L2-D backend API is available under /api/dashboard. The Vue UI will land after the API stabilizes.</p>
    </main>
  </body>
</html>
