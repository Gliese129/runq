# runq project configuration
#
# Register with:  runq project add .          (from this directory)
#            or:  runq project add myname     (override name via CLI)
#
# Config priority: CLI flag > YAML field > built-in default

project_name: resnet50
working_dir: /home/user/projects/resnet50
command_template: python train.py {{args}}

# Environment variables injected into every task
environment:
  WANDB_PROJECT: resnet-experiments

# Defaults (can be overridden per-job in job.yaml → overrides)
defaults:
  gpus_per_task: 1
  max_retry: 3       # 0 = unlimited retries

# Resume configuration
# Set enabled: true only if your training script supports checkpoint resume.
# extra_args are appended to the command when a crashed task is auto-restarted.
resume:
  enabled: true
  extra_args: --resume --ckpt latest

# L2-C: optional wandb integration.
# When this block is present, daemon writes <task_dir>/wandb_config.json and
# injects RUNQ_WANDB_CONFIG_FILE into the task env. The Python SDK reads it
# via ctx.wandb_cfg and the user can spread it into wandb.init:
#
#     import wandb, runq
#     ctx = runq.context()
#     wandb.init(**ctx.wandb_cfg)
#
# Omit the entire block to disable wandb integration; the SDK will still log
# metrics locally to metrics.jsonl, just without forwarding to wandb.
# wandb:
#   project: my-experiment
#   entity:  my-team             # optional
#   tags:    [vision, baseline]  # optional; SDK may append more via with_tags
#   mode:    online              # online / offline / disabled (optional)
